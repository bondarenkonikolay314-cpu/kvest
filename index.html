<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151A2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Квест">
<title>Квест-планер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-first column (max 680px), fixed bottom tab bar. Tabs: Today (habits, boss, todos, focus, money glance) · Money · Progress · Settings */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --surface-2:#F4F5FA; --ink:#151A2D; --muted:#5B6280; --line:#DCDFEA;
  --gold:#E09A0B; --gold-ink:#8F5D00; --gold-soft:#FCEFD0;
  --home:#0B8A7C; --home-soft:#D7F2EE; --body:#D9434A; --body-soft:#FBE0E1; --mind:#6A50C9; --mind-soft:#E8E2FB;
  --money:#1D7A5F; --money-soft:#D9EFE5; --shield:#2F6FD6; --shield-soft:#DCE7FB;
  --good:#2B8A3E; --good-soft:#DDF3E2; --warn:#B8740C; --warn-soft:#F8EBD2; --bad:#C2363D; --bad-soft:#F9DEDF;
  --heat0:#E3E6EF;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2E; --surface-2:#1E2338; --ink:#E8EAF4; --muted:#979DBA; --line:#2B3050;
  --gold:#F4B63A; --gold-ink:#F7C566; --gold-soft:#3A2E12;
  --home:#2ECDB8; --home-soft:#123532; --body:#FF6E73; --body-soft:#3D1D22; --mind:#A48DFF; --mind-soft:#2A2350;
  --money:#5BC3A1; --money-soft:#173229; --shield:#6EA4FF; --shield-soft:#1A2A4A;
  --good:#5BD07A; --good-soft:#173322; --warn:#F2B04A; --warn-soft:#33281A; --bad:#FF6E73; --bad-soft:#3D1D22; --heat0:#232842; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2E; --surface-2:#1E2338; --ink:#E8EAF4; --muted:#979DBA; --line:#2B3050;
  --gold:#F4B63A; --gold-ink:#F7C566; --gold-soft:#3A2E12;
  --home:#2ECDB8; --home-soft:#123532; --body:#FF6E73; --body-soft:#3D1D22; --mind:#A48DFF; --mind-soft:#2A2350;
  --money:#5BC3A1; --money-soft:#173229; --shield:#6EA4FF; --shield-soft:#1A2A4A;
  --good:#5BD07A; --good-soft:#173322; --warn:#F2B04A; --warn-soft:#33281A; --bad:#FF6E73; --bad-soft:#3D1D22; --heat0:#232842; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:20px;text-wrap:balance}
h2{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note,.small{font-size:13px}
.note,.muted{color:var(--muted)}
.num{font-family:var(--f-mono)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.h{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25}

/* buttons */
.primary,.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn{background:var(--money);color:#fff}
.btn.ghost,.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.sm,.primary.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.primary.wide{width:100%;padding:14px;font-size:15px}
.primary.gold{background:var(--gold);color:#241800}
.danger{color:var(--bad)!important}
.dangerfill{background:var(--bad)!important;color:#fff!important}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none;padding:0}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn.sm{width:30px;height:30px;border-radius:8px}
.x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:20px;line-height:1;flex:none;padding:0}
.x:hover{background:var(--surface-2)}
.del{border:0;background:var(--bad);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;flex:none}
.text{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
select.text{padding:9px 8px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.lvl{width:64px;height:64px;display:grid;place-items:center;position:relative}
.lvl svg{position:absolute;inset:0;width:100%;height:100%}
.lvl b{font-family:var(--f-display);font-weight:700;font-size:23px;position:relative;color:var(--gold-ink)}
.who{min-width:0;display:flex;flex-direction:column;gap:5px}
.rank{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 65%,#fff));border-radius:99px;transition:width .5s}
.xpline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;flex-direction:column;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.chip .v{font-family:var(--f-mono);font-weight:700;font-size:20px;line-height:1.2;display:flex;align-items:center;gap:5px}
.chip .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.fire .v{color:var(--body)} .chip.shield .v{color:var(--shield)} .chip.gold .v{color:var(--gold-ink)}

.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:none;margin-top:2px}
.banner.comeback{background:var(--gold-soft)} .banner.shieldb{background:var(--shield-soft)} .banner.streak{background:var(--body-soft)}
.banner b{display:block}

/* minimum */
.mincard{border-width:2px}
.mincard.ok{border-color:var(--good);background:color-mix(in srgb,var(--good-soft) 55%,var(--surface))}
.minprog{font-family:var(--f-display);font-weight:700;font-size:22px;white-space:nowrap}
.minlist{display:flex;flex-wrap:wrap;gap:8px}
.minchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px 8px 10px;font-weight:700;font-size:14px}
.minchip .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.minchip.done{background:var(--good);border-color:var(--good);color:#fff}
.minchip.done .dot{border-color:#fff;background:#fff}
.minchip.done .dot svg path{stroke:var(--good)}

/* boss */
.boss{border:2px solid var(--body);background:linear-gradient(160deg,color-mix(in srgb,var(--body-soft) 70%,var(--surface)),var(--surface) 60%)}
.boss.won{border-color:var(--gold);background:var(--gold-soft)}
.boss.empty{border-style:dashed}
.bossname{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.bossname.small{font-size:16px;font-weight:500}
.hp{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:var(--body);border-radius:99px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pickbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;text-align:left;max-width:100%;overflow-wrap:anywhere}
.inline{display:flex;gap:8px}
.inline .text{flex:1}

/* habits */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:8px;min-width:0}
.daytitle{font-family:var(--f-display);font-weight:500;font-size:16px}
.dayhint{font-size:12px;color:var(--muted)}
.legend2{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.gdot{width:9px;height:9px;border-radius:3px;background:var(--c)}
.group{display:flex;flex-direction:column;gap:6px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;border:0;background:none;width:100%;text-align:left;border-radius:8px}
.gname{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:500;font-size:15px;flex-wrap:wrap}
.ghint{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.chev{align-self:center;transition:transform .15s;color:var(--muted)}
.ghead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.gcount{font-size:12px;color:var(--muted);white-space:nowrap}
.group.full .gcount{color:var(--good);font-weight:800}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:background .15s,border-color .15s}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid color-mix(in srgb,var(--c) 60%,var(--line));display:grid;place-items:center}
.task .box svg{opacity:0;transform:scale(.6);transition:.15s}
.task.done{background:var(--soft);border-color:transparent}
.task.done .box{background:var(--c);border-color:var(--c)}
.task.done .box svg{opacity:1;transform:none}
.task.done .tname{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
.tname{font-weight:700;font-size:14.5px}
.twhy{font-size:12.5px;color:var(--muted);line-height:1.35}
.tmeta{display:flex;align-items:center;gap:6px}
.xp{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.task.done .xp{background:var(--gold-soft);color:var(--gold-ink)}
.star{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.home{--c:var(--home);--soft:var(--home-soft)} .body{--c:var(--body);--soft:var(--body-soft)} .mind{--c:var(--mind);--soft:var(--mind-soft)} .money{--c:var(--money);--soft:var(--money-soft)}

/* todos */
.todo{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.tbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0}
.todo.done .tbox{background:var(--gold);border-color:var(--gold)}
.todo.done .tn{text-decoration:line-through;color:var(--muted)}
.tn{font-weight:600;overflow-wrap:anywhere}
.tn small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.todo.flash{animation:flash 1.6s ease 2;border-radius:10px}
@keyframes flash{0%,100%{background:transparent}40%{background:var(--gold-soft)}}
.addtodo{display:grid;grid-template-columns:1fr auto auto;gap:8px}

/* sprint */
.clock{font-family:var(--f-mono);font-weight:700;font-size:30px;color:var(--mind)}
.sprint.run{border-color:var(--mind);border-width:2px}

/* money glance */
.mbig{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15}
.mm.bad .mbig{color:var(--bad)}
.warnline{font-size:13px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:10px}

/* money tab */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.mhero{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--money-soft)}
.mhero.warn{background:var(--warn-soft)} .mhero.bad{background:var(--bad-soft)}
.mhero .label{font-weight:800;font-size:14px}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface);white-space:nowrap}
.pill.ok{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1;letter-spacing:-.02em}
.mhero.bad .big{color:var(--bad)}
.meter{height:10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--money);transition:width .4s}
.meter.warn i,.mhero.warn .meter i{background:var(--warn)} .meter.bad i,.mhero.bad .meter i{background:var(--bad)}
.mhero .sub{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--money)}
.nudge .txt{flex:1 1 220px;min-width:0}
.nudge .txt b{display:block}
.amount{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:2px 14px}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:500;font-size:26px;padding:8px 0;outline:none}
.amount span{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.amount.sm input{font-size:18px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:700}
.cchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cchip.inc[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .sum{font-weight:800;white-space:nowrap}
.item .sum.inc{color:var(--good)}
.dayrow{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:12px}
.empty{color:var(--muted);font-size:14px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--money);flex:none}
.check .main{flex:1;min-width:0}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.eq{display:flex;flex-direction:column;gap:6px}
.eq .row.total{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.minus{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--money);border-radius:99px}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--money)} .chart .b.over{fill:var(--warn)} .chart .b.future{fill:var(--surface-2)} .chart .b.today{fill:var(--ink)}
.chart .lim{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.2}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.closecard.done{border-color:var(--good);background:color-mix(in srgb,var(--good-soft) 50%,var(--surface))}
.debt{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.debt .hp i{background:var(--bad)}
.debt.dead .hp i{background:var(--gold)}

/* progress */
.week svg{width:100%;height:auto;display:block}
.week text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.week .lbl{font-family:var(--f-body);font-size:11px}
.week .today{fill:var(--ink);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--heat0);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cal .c.fut{background:transparent;border:1px dashed var(--line)}
.cal .c.now{outline:2px solid var(--ink);outline-offset:1px}
.cal .c.hi{color:#fff}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rec{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.rec .v{font-family:var(--f-mono);font-weight:700;font-size:19px}
.rec .k{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:10px;align-items:center;font-size:13px}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--c);border-radius:99px}
.hbar .p{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.badge{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.badge .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted)}
.badge.got .ic{background:var(--gold);color:#241800}
.badge:not(.got){opacity:.6}
.badge .bn{font-weight:800;font-size:13.5px}

function model(){
  const cfg0=D.fin.cfg;if(!cfg0)return null;
  const todayD=parse(today()),per=periodAt(cfg0,todayD);if(!per)return null;
  const cfg={...cfg0,bills:allBills(per.key)};
  const P=D.fin.periods,pdoc=P[per.key]||{},txs=txList();
  const anchorOk=a=>a&&a.d>=iso(per.start)&&a.d<iso(per.end)?a:null;
  const num=v=>(v==null||v===""?null:Number(v));
  const cur=calcPeriod(cfg,txs,per,todayD,anchorOk(pdoc.anchor),num(pdoc.income));
  let prevPer=periodAt(cfg,addD(per.start,-1));
  if(prevPer&&cfg.since&&iso(prevPer.end)<=cfg.since)prevPer=null;
  const prevDoc=prevPer?(P[prevPer.key]||{}):{};
  const prevAnchor=prevPer&&prevDoc.anchor&&prevDoc.anchor.d>=iso(prevPer.start)?prevDoc.anchor:null;
  const prev=prevPer?calcPeriod(cfg,txs,prevPer,null,prevAnchor,num(prevDoc.income)):null;
  const cushion=(Number(cfg.cushionStart)||0)+Object.values(P).reduce((s,p)=>s+(Number(p.saved)||0)+(Number(p.extra)||0),0);
  return {cfg,todayD,per,cur,prevPer,prev,pdoc,prevDoc,cushion};
}
function patchPeriod(key,patch){D.fin.periods[key]={saved:0,extra:0,paid:{},...(D.fin.periods[key]||{}),...patch,at:Date.now()}}

/* ================= game rules ================= */
function dayDone(date){
  const r=D.days[date],set=new Set(r?r.done:[]);
  const m=D.mclose[date];if(m&&!m.del)set.add("money");else set.delete("money");
  return set;
}
function dayInfo(date){
  const set=dayDone(date),hs=D.habits,done=hs.filter(h=>set.has(h.id)),core=hs.filter(h=>h.core);
  const coreDone=core.filter(h=>set.has(h.id)).length;
  const counted=core.length?coreDone===core.length:(hs.length>0&&done.length/hs.length>=.7);
  const blocks=TIMES.filter(t=>{const b=hs.filter(h=>(h.time||"day")===t.id);return b.length&&b.every(h=>set.has(h.id))}).map(t=>t.id);
  const perfect=hs.length>0&&done.length===hs.length;
  const base=done.reduce((s,h)=>s+(XP[h.diff]||10),0);
  return {set,done,count:done.length,total:hs.length,pct:hs.length?Math.round(done.length/hs.length*100):0,core,coreDone,counted,blocks,perfect,
    habitXp:base+blocks.length*BONUS.block+(counted?BONUS.core:0)+(perfect?BONUS.perfect:0)};
}
const cumXp=L=>60*(L-1)*L;
function levelOf(xp){let L=1;while(cumXp(L+1)<=xp)L++;return L}
function rankOf(L){let r=RANKS[0][1];for(const [l,n] of RANKS)if(L>=l)r=n;return r}
function nextRank(L){for(const [l,n] of RANKS)if(l>L)return [l,n];return null}
const bossOf=d=>{const b=D.boss[d];return b&&!b.del&&b.id?b.id:null};

function summary(){
  const t=today(),rd=D.resetAt?ds(new Date(D.resetAt)):"";
  const ok=d=>d&&d<=t&&!(rd&&d<rd);
  const xpd={},add=(d,v)=>{if(!ok(d)||!v)return;xpd[d]=(xpd[d]||0)+v};
  const info={};let perfectDays=0;
  for(const d of new Set([...Object.keys(D.days),...Object.keys(D.mclose)])){if(!ok(d))continue;const i=dayInfo(d);if(i.count>0){info[d]=i;add(d,i.habitXp);if(i.perfect)perfectDays++}}
  let bosses=0,todosDone=0;
  for(const x of Object.values(D.todos)){if(x.del||!x.doneDate||(x.doneAt||0)<(D.resetAt||0))continue;const isB=bossOf(x.doneDate)===x.id;if(ok(x.doneDate)){isB?bosses++:todosDone++}add(x.doneDate,isB?BONUS.boss:(XP[x.diff]||10))}
  let sprints=0;for(const [d,r] of Object.entries(D.sprints)){const n=Math.min(r.n||0,SPRINT_MAX_DAY);if(ok(d)){sprints+=n;add(d,n*BONUS.sprint)}}
  let closes=0,unders=0;for(const [d,r] of Object.entries(D.mclose)){if(r.del||!ok(d))continue;closes++;if(r.under){unders++;add(d,BONUS.closeUnder)}}
  let saves=0;
  for(const p of Object.values(D.fin.periods)){
    if(p.saved>0&&ok(p.savedDate)){saves++;add(p.savedDate,BONUS.save)}
    if(p.extra>0&&ok(p.extraDate)){saves++;add(p.extraDate,BONUS.save)}
    for(const [id,v] of Object.entries(p.paid||{}))if(v&&v.d)add(v.d,id.indexOf("debt:")===0?BONUS.debtPay:BONUS.billPaid);
  }
  const dpd={};for(const x of txList())if(x.cat==="debt"){dpd[x.d]=(dpd[x.d]||0)+1;if(dpd[x.d]<=3)add(x.d,BONUS.debtPay)}
  const debtsKilled=liveDebts().filter(d=>Number(d.left)>0&&debtLeft(d)<=0).length;
  const first=Object.keys(info).sort()[0];
  /* streak: shields absorb missed days; once they run out the streak breaks, but a repair quest
     (minimum + REPAIR_EXTRA more habits, within REPAIR_WINDOW days of the break) brings it back whole */
  let streak=0,best=0,shields=0,cc=0,lastBreak=0,lastCc=0,breakDay=null,lastOk=null,comebacks=0,pending=null;const bonusBy={},frozen={},comeback={},repaired={};
  if(first)for(let d=first;d<=t;d=addDays(d,1)){
    const i=info[d],c=i&&i.counted;
    if(c){
      if(streak===0&&lastBreak>0){
        const inWindow=diffD(breakDay,d)<=REPAIR_WINDOW,extra=i.count-i.coreDone;
        if(inWindow&&extra>=REPAIR_EXTRA){
          streak=lastBreak;cc=lastCc;for(let g=addDays(lastOk,1);g<d;g=addDays(g,1))frozen[g]=true;
          repaired[d]=true;comeback[d]=true;comebacks++;add(d,BONUS.comeback);
        }else if(inWindow&&d===t)pending={was:lastBreak,need:REPAIR_EXTRA-extra};
        else if(lastBreak>=3){add(d,BONUS.comeback);comeback[d]=true;comebacks++}
        lastBreak=0;
      }
      streak++;cc++;lastOk=d;if(cc%SHIELD_EVERY===0&&shields<SHIELD_MAX)shields++;
      const b=Math.min(streak,10)*5;add(d,b);bonusBy[d]=b;if(streak>best)best=streak;
    }else if(d<t&&streak>0){
      if(shields>0){shields--;frozen[d]=true}else{lastBreak=streak;lastCc=cc;breakDay=d;streak=0;cc=0}
    }
  }
  let repair=null;
  if(pending)repair={was:pending.was,need:pending.need,deadline:t,started:true};
  else if(streak===0&&lastBreak>0&&diffD(breakDay,t)<=REPAIR_WINDOW)repair={was:lastBreak,need:REPAIR_EXTRA,deadline:addDays(breakDay,REPAIR_WINDOW)};
  const xp=Object.values(xpd).reduce((a,b)=>a+b,0);
  return {xp,xpd,info,streak,best,shields,lastBreak,frozen,comeback,repaired,repair,bonusBy,perfectDays,bosses,todosDone,sprints,closes,unders,saves,debtsKilled,comebacks,first};
}
function achList(s){const L=levelOf(s.xp);return [
  ["1","Первый шаг","Отметить первую привычку",Object.keys(s.info).length?1:0,1],
  ["3","Разогрев","Серия 3 дня",s.best,3],
  ["7","Неделя в строю","Серия 7 дней, первый щит",s.best,7],
  ["21","Привычка","Серия 21 день",s.best,21],
  ["30","Железная воля","Серия 30 дней",s.best,30],
  ["Б","Охотник","Победить первого босса",s.bosses,1],
  ["Б10","Гроза боссов","Победить 10 боссов",s.bosses,10],
  ["S","Идеальный день","Закрыть все привычки за день",s.perfectDays,1],
  ["Ф","В потоке","10 фокус-спринтов",s.sprints,10],
  ["₽","Бухгалтер","Закрыть 7 дней по деньгам",s.closes,7],
  ["Л","В рамках","10 дней в дневном лимите",s.unders,10],
  ["П","Подушка","Отложить в подушку 3 раза",s.saves,3],
  ["Д","Долг повержен","Полностью закрыть долг",s.debtsKilled,1],
  ["R","Возвращение","Вернуться в строй после срыва",s.comebacks,1],
  ["5","Подмастерье","Достичь 5 уровня",L,5],
  ["XP","Пять тысяч","Набрать 5000 XP",s.xp,5000]
].map(([ic,n,d,v,g])=>({ic,n,d,v,g,ok:v>=g}))}

function toast(html,big){
  const el=document.createElement("div");el.className="toast"+(big?" big":"");el.innerHTML=html;

/* run a data change, save, then celebrate whatever it earned */
function act(fn){
  const b=summary(),label=fn();save();const a=summary(),t=today();
  const gain=a.xp-b.xp;
  if(gain>0)toast('<span class="x">+'+gain+' XP</span>'+(label?" "+esc(label):""));
  const bi=b.info[t],ai=a.info[t];
  if(a.repaired[t]&&!b.repaired[t])toast("Серия восстановлена: "+daysW(a.streak)+"! +"+BONUS.comeback+" XP",true);
  else if(ai&&ai.counted&&!(bi&&bi.counted))toast(a.comeback[t]?"Вернулся в строй! +"+BONUS.comeback+" XP":"Минимум закрыт. День в серии",true);
  if(ai&&ai.perfect&&!(bi&&bi.perfect))toast("Идеальный день! +"+BONUS.perfect+" XP",true);
  const lb=levelOf(b.xp),la=levelOf(a.xp);if(la>lb)toast("Уровень "+la+": "+rankOf(la),true);
  const had=new Set(achList(b).filter(x=>x.ok).map(x=>x.n));achList(a).filter(x=>x.ok&&!had.has(x.n)).forEach(x=>toast("Достижение: "+esc(x.n),true));
  render();
}
function toggleHabit(id){
  const date=U.view,h=D.habits.find(x=>x.id===id);if(!h)return;
  act(()=>{
    if(id==="money")return toggleClose(date)?h.name:null;
    const r=D.days[date],set=new Set(r?r.done:[]),was=set.has(id);
    was?set.delete(id):set.add(id);D.days[date]={done:[...set],at:Date.now()};
    return was?null:h.name;
  });
}
function toggleClose(date){
  const m=D.mclose[date],was=!!(m&&!m.del);let under=false;
  if(!was&&date===today()){const mm=model();if(mm&&(mm.cur.baseKnown||mm.per.pay.amount))under=mm.cur.leftToday>=0&&mm.cur.periodLeft>=0}
  D.mclose[date]={at:Date.now(),del:was,under:!was&&under};
  return !was;
}
function toggleTodo(id){

function sprintLeft(){return dev.sprint?Math.max(0,dev.sprint.start+SPRINT_MIN*60000-Date.now()):0}
const mmss=ms=>{const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+":"+pad(s%60)};
function sprintTick(){

function betCard(m){
  const lim=Number(m.cfg.betLimit)||0,b=m.cur.bet;
  if(!lim&&!b.in&&!b.out)return "";
  const net=b.in-b.out,p=lim?Math.min(100,b.out/lim*100):0,over=lim&&b.out>lim,cls=over?"bad":p>=75?"warn":"";
  return '<section class="card"><div class="row"><h2>Ставки за период</h2><span class="pill '+(over?"bad":p>=75?"warn":"ok")+'">'+(lim?(over?"Лимит превышен":"осталось "+rub(Math.max(0,lim-b.out))):"без лимита")+'</span></div>'
   +(lim?'<div class="meter '+cls+'"><i style="width:'+p+'%"></i></div>':"")
   +'<div class="eq"><div class="row minus"><span>Внёс в БК'+(lim?" (лимит "+rub(lim)+")":"")+'</span><span>−'+rub(b.out)+'</span></div><div class="row minus"><span>Вывел</span><span>+'+rub(b.in)+'</span></div><div class="row total"><span>Итог</span><span style="color:'+(net>=0?"var(--good)":"var(--bad)")+'">'+(net>=0?"+":"")+rub(net)+'</span></div></div>'
   +(over?'<p class="warnline">Стоп до следующей выплаты: деньги на ставки этого периода закончились.</p>':(!lim?'<p class="small muted">Задай лимит на ставки в «Настройках» → «Бюджет».</p>':""))+'</section>';
}
function chart(cur,per){
  const n=Math.max(1,diffDays(per.start,per.end)),W=600,H=170,padL=6,padR=6,padT=18,padB=22;
  const vals=[];for(let i=0;i<n;i++){const d=iso(addD(per.start,i));vals.push({d,v:cur.byDay[d]||0,i})}
  const lim=Math.max(0,cur.avgLimit),max=Math.max(lim*1.5,...vals.map(x=>x.v),1);
  const bw=(W-padL-padR)/n,gap=Math.min(6,bw*.25),y=v=>padT+(H-padT-padB)*(1-v/max),t=today();
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Траты по дням периода">';
  const step=n>20?3:n>12?2:1;
  vals.forEach(x=>{const fut=x.d>t,cls=x.d===t?"today":fut?"future":(x.v>lim?"over":"");
    const hh=fut?3:Math.max(x.v>0?3:1.5,(H-padT-padB)-(y(x.v)-padT)),xx=padL+x.i*bw+gap/2;
    s+='<rect class="b '+cls+'" x="'+xx.toFixed(1)+'" y="'+(H-padB-hh).toFixed(1)+'" width="'+(bw-gap).toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3"><title>'+dm(fromIso(x.d))+": "+rub(x.v)+'</title></rect>';
    if(x.i%step===0||x.d===t)s+='<text x="'+(xx+(bw-gap)/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle"'+(x.d===t?' style="font-weight:700;fill:var(--ink)"':"")+'>'+fromIso(x.d).getDate()+'</text>'});
  if(lim>0){const ly=y(lim).toFixed(1);s+='<line class="lim" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+ly+'" y2="'+ly+'"/><text x="'+(W-padR)+'" y="'+(+ly-5).toFixed(1)+'" text-anchor="end">'+rub(lim)+'</text>'}
  return s+"</svg>";
}

   +'<div class="row total"><span>На жизнь</span><span>'+rub(cur.free)+'</span></div>'
   +'<div class="row minus"><span>Уже потрачено</span><span>−'+rub(cur.spent)+'</span></div>'
   +'<div class="row total"><span>Осталось</span><span style="'+(cur.periodLeft<0?"color:var(--bad)":"")+'">'+rub(cur.periodLeft)+'</span></div></div>'
   +(cur.anchored?"":'<details><summary class="small" style="cursor:pointer;color:var(--money);font-weight:800">'+(cur.baseKnown?"Исправить сумму выплаты":"Вписать сумму выплаты")+'</summary><form data-f="payin" class="inline" style="margin-top:8px" autocomplete="off" novalidate><div class="amount sm" style="flex:1"><input id="payamt2" inputmode="decimal" placeholder="'+NF.format(cur.base)+'" aria-label="Сумма выплаты"><span>₽</span></div><button class="btn sm">Сохранить</button></form></details>')
   +(cur.free<=0?'<p class="err">Обязательные платежи и подушка съедают всю выплату. Проверь настройки или перенеси часть платежей на другую выплату.</p>':'<p class="small muted">В среднем '+rub(cur.avgLimit)+' в день на '+daysW(cur.totalDays)+'.</p>')+'</section>');
  out.push('<section class="card"><div class="row"><h2>По дням</h2><span class="small muted">пунктир — средний лимит</span></div>'+chart(cur,per)+'</section>');
  const cats=Object.entries(cur.byCat).sort((a,b)=>b[1]-a[1]),maxC=cats.length?cats[0][1]:1;
  out.push('<section class="card"><h2>Куда ушли деньги</h2>'+(cats.length?'<div class="bars">'+cats.map(([c,v])=>'<div><div class="row"><span>'+esc(catName(c))+'</span><span><b>'+rub(v)+'</b> <span class="muted small">'+Math.round(v/(cur.spent||1)*100)+'%</span></span></div><div class="track"><i style="width:'+(v/maxC*100)+'%"></i></div></div>').join("")+'</div>':'<p class="empty">В этом периоде трат пока нет.</p>')+'</section>');
  out.push(betCard(m));
  out.push('<section class="card"><div class="row"><h2>Обязательные платежи</h2><span class="small muted">'+rub(cur.billsSum)+'</span></div>'
   +(cur.bills.length?'<div class="list">'+cur.bills.map(b=>'<label class="check'+(paid[b.id]?" done":"")+'"><input type="checkbox" data-a="togglepaid" data-id="'+esc(b.id)+'"'+(paid[b.id]?" checked":"")+'><span class="main"><span class="t">'+esc(b.name)+'</span> <span class="small muted">'+dm(b.date)+'</span></span><span class="sum">'+rub(b.amount)+'</span></label>').join("")+'</div>':'<p class="empty">В этом периоде платежей нет. Добавить их можно в «Настройках».</p>')+'</section>');
  out.push(debtsCard());
  const goal=Number(cfg.cushionGoal)||0,gp=goal?Math.min(100,m.cushion/goal*100):0;
  const monthlySave=Math.max(cur.save,(cfg.pays||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)*(Number(cfg.savePct)||0)/100);
  out.push('<section class="card"><div class="row"><h2>Финансовая подушка</h2>'+(goal?'<span class="small muted">цель '+rub(goal)+'</span>':"")+'</div><div class="big" style="font-size:32px">'+rub(m.cushion)+'</div>'
   +(goal?'<div class="meter"><i style="width:'+gp+'%"></i></div><p class="small muted">'+Math.round(gp)+'% от цели'+(m.cushion<goal&&monthlySave>0?" · в таком темпе ещё ≈ "+Math.ceil((goal-m.cushion)/monthlySave)+" мес.":"")+'</p>':'<p class="small muted">Задай цель в настройках: обычно это 3–6 месяцев обязательных расходов.</p>')
   +'<div class="row"><span class="small">'+(pdoc.saved?"В этом периоде отложено "+rub(pdoc.saved):"В этом периоде ещё не отложено")+'</span>'+(pdoc.saved?'<button class="linkbtn" data-a="unsave">Отменить</button>':(cur.save>0?'<button class="btn sm" data-a="save" data-v="'+cur.save+'">Отложил '+rub(cur.save)+'</button>':""))+'</div></section>');
  if(m.prev){const p=m.prev;out.push('<section class="card"><h2>Прошлый период</h2><p>'+dm(m.prevPer.start)+" – "+dm(addD(m.prevPer.end,-1))+": на жизнь было "+rub(p.free)+", потрачено "+rub(p.spent)+". "+(p.periodLeft>=0?'<b style="color:var(--good)">Осталось '+rub(p.periodLeft)+'.</b>':'<b style="color:var(--bad)">Перерасход '+rub(-p.periodLeft)+'.</b>')+'</p>'+(m.prevDoc.extra?'<p class="small muted">Остаток '+rub(m.prevDoc.extra)+' переложен в подушку.</p>':"")+'</section>')}
  const txs=cur.inP.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));let last="",rows="";
  txs.forEach(x=>{if(x.d!==last){last=x.d;const d=fromIso(x.d);rows+='<div class="dayrow">'+dm(d)+", "+WD[d.getDay()]+" · "+rub(cur.byDay[x.d]||0)+'</div>'}rows+=txRow(x)});
  out.push('<section class="card"><h2>Все записи периода</h2><div class="list">'+(rows||'<p class="empty">Записей пока нет.</p>')+'</div></section>');
  return out.join("");
}

/* ---------- Progress ---------- */
function heat(i,frozen){
  if(frozen)return "var(--shield)";
  if(!i||i.count===0)return "var(--heat0)";
  if(i.perfect)return "var(--gold)";
  if(i.counted)return "color-mix(in srgb,var(--good) "+(65+Math.round(i.pct/100*30))+"%,var(--heat0))";
  return "color-mix(in srgb,var(--warn) "+(25+Math.round(i.pct/100*35))+"%,var(--heat0))";
}
function statsHtml(s){
  const t=today();let h='<h1>Прогресс</h1>'+heroHtml(s);
  // week
  const W=330,H=150,top=16,bot=28,ch=H-top-bot,bw=28,PW=W-10,gap=(PW-7*bw)/8;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Выполнение привычек за 7 дней">';
  svg+='<line x1="0" x2="'+W+'" y1="'+(top+ch)+'" y2="'+(top+ch)+'" stroke="var(--line)"/>';
  let tot=0,n=0;
  for(let k=0;k<7;k++){const d=addDays(t,k-6),i=s.info[d],p=i?i.pct:0,x=gap+k*(bw+gap);
    if(s.first&&d>=s.first){tot+=p;n++}
    const hh=Math.max(p?3:0,ch*p/100),col=i&&i.perfect?"var(--gold)":i&&i.counted?"var(--good)":s.frozen[d]?"var(--shield)":"color-mix(in srgb,var(--warn) 55%,var(--surface-2))";
    svg+='<rect x="'+x+'" y="'+(top+ch-hh)+'" width="'+bw+'" height="'+hh+'" rx="5" fill="'+col+'"/>';
    if(p)svg+='<text x="'+(x+bw/2)+'" y="'+(top+ch-hh-4)+'" text-anchor="middle">'+p+'</text>';
    svg+='<text class="lbl'+(d===t?" today":"")+'" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+(d===t?"сег":DOW[dowIdx(d)])+'</text>'}
  svg+="</svg>";
  h+='<section class="panel week"><div class="row"><h2>Последние 7 дней</h2><span class="note">'+(n?"в среднем "+Math.round(tot/n)+"%":"")+'</span></div>'+svg+'<p class="note">Зелёный — минимум закрыт, золотой — идеальный день, синий — спас щит.</p></section>';
  // calendar
  const start=addDays(t,-dowIdx(t)-35);let cal=DOW.map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let k=0;k<42;k++){const d=addDays(start,k),i=s.info[d],fut=d>t,fr=s.frozen[d];
    cal+='<div class="c'+(fut?" fut":"")+(d===t?" now":"")+((i&&i.counted)||fr?" hi":"")+'" style="'+(fut?"":"background:"+heat(i,fr))+'" title="'+d+'">'+parse(d).getDate()+'</div>'}
  const last30=[];if(s.first)for(let k=29;k>=0;k--){const d=addDays(t,-k);if(d>=s.first)last30.push(d)}
  const passed=last30.filter(d=>s.info[d]&&s.info[d].counted).length;
  h+='<section class="panel"><div class="row"><h2>Карта дисциплины</h2><span class="note">6 недель</span></div><div class="cal">'+cal+'</div>'
   +'<div class="legend"><i style="background:var(--heat0)"></i>пусто<i style="background:'+heat({count:1,pct:40})+'"></i>частично<i style="background:'+heat({count:1,pct:70,counted:true})+'"></i>минимум<i style="background:var(--gold)"></i>идеально<i style="background:var(--shield)"></i>щит</div>'
   +'<div class="records"><div class="rec"><div class="v">'+passed+" / "+last30.length+'</div><div class="k">зачётных дней за 30</div></div><div class="rec"><div class="v">'+s.best+'</div><div class="k">лучшая серия</div></div><div class="rec"><div class="v">'+s.bosses+'</div><div class="k">боссов повержено</div></div><div class="rec"><div class="v">'+s.unders+" / "+s.closes+'</div><div class="k">дней в лимите / закрыто</div></div></div></section>';
  // weak spots
  if(last30.length){
    const rows=D.habits.map(x=>{const c=last30.filter(d=>dayDone(d).has(x.id)).length;return {x,p:Math.round(c/last30.length*100)}}).sort((a,b)=>a.p-b.p);
    h+='<section class="panel"><div class="row"><h2>Где проседаешь</h2><span class="note">за '+daysW(last30.length)+', слабые сверху</span></div><div class="bars">'+rows.map(r=>'<div class="hbar '+esc(r.x.cat)+'"><span class="n">'+esc(r.x.name)+'</span><span class="t"><i style="width:'+r.p+'%"></i></span><span class="p">'+r.p+'%</span></div>').join("")+'</div><p class="note">Если привычка неделями внизу — сделай её проще («5 минут английского» вместо 15) или убери. Лучше маленькая, но каждый день.</p></section>';
  }
  const al=achList(s);
  h+='<section class="panel"><div class="row"><h2>Достижения</h2><span class="note">открыто '+al.filter(a=>a.ok).length+' из '+al.length+'</span></div><div class="ach">'+al.map(a=>'<div class="badge'+(a.ok?" got":"")+'"><span class="ic">'+a.ic+'</span><span><div class="bn">'+esc(a.n)+'</div><div class="bd">'+esc(a.d)+'</div>'+(a.ok?"":'<div class="prog">'+Math.min(a.v,a.g).toLocaleString("ru-RU")+" / "+a.g.toLocaleString("ru-RU")+'</div>')+'</span></div>').join("")+'</div></section>';
  h+='<section class="panel"><h2>Правила игры</h2><ol class="steps"><li><b>Минимум дня</b> (привычки со звёздочкой) = зачёт и +1 к серии. Остальное — бонусный опыт.</li><li><b>Щит</b> выдаётся за каждые '+SHIELD_EVERY+' зачётных дней подряд (максимум '+SHIELD_MAX+'). Пропустил день — щит сгорает вместо серии.</li><li><b>Серию можно вернуть.</b> Если щитов не осталось и серия прервалась, у тебя '+REPAIR_WINDOW+' дня на квест восстановления: минимум + ещё '+REPAIR_EXTRA+' любые привычки. Серия вернётся целиком, плюс +'+BONUS.comeback+' XP.</li><li><b>Босс дня</b> +'+BONUS.boss+' XP, закрыл блок (утро/день/вечер) целиком +'+BONUS.block+', идеальный день +'+BONUS.perfect+', бонус серии +5 XP за каждый день (до +50).</li><li><b>Деньги:</b> закрыл день в лимите +'+BONUS.closeUnder+', отложил в подушку +'+BONUS.save+', оплатил счёт +'+BONUS.billPaid+', платёж по долгу +'+BONUS.debtPay+'.</li></ol></section>';
  return h;
}

  bills.forEach(b=>{if(!b.name)b.name="Платёж";if(!(b.amount>0))errs.push("Укажи сумму для «"+b.name+"».");if(!(b.day>=1&&b.day<=31))errs.push("Укажи число месяца (1–31) для «"+b.name+"».")});
  let savePct=parseAmt($("sp").value);if(!isFinite(savePct))savePct=0;if(savePct<0||savePct>90)errs.push("Процент в подушку — от 0 до 90.");
  let extraPct=parseAmt($("xpp").value);if(!isFinite(extraPct))extraPct=0;if(extraPct<0||extraPct>100)errs.push("Процент с премий — от 0 до 100.");

/* ================= sync: GitHub Gist ================= */
const GIST_FILE="kvest-planer.json";
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const keyCache={};
async function aesKey(pass,salt){
  const ck=pass+"|"+b64(salt);if(keyCache[ck])return keyCache[ck];
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return keyCache[ck]=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
let encSalt=null;
async function packData(obj){
  const json=JSON.stringify(obj);
  if(!dev.pass)return json;
  if(!crypto.subtle)throw new Error("Шифрование недоступно: открой планер по https-ссылке");
  if(!encSalt)encSalt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12)),k=await aesKey(dev.pass,encSalt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(json));
  return JSON.stringify({app:"kvest-planer",enc:1,salt:b64(encSalt),iv:b64(iv),data:b64(ct)});
}
async function unpackData(text){
  if(!text||!text.trim())return null;
  const o=JSON.parse(text);
  if(o.enc){
    if(!dev.pass)throw new Error("Данные в облаке зашифрованы. Отключи синхронизацию и подключи заново с паролем.");
    const salt=unb64(o.salt);
    try{const k=await aesKey(dev.pass,salt);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},k,unb64(o.data));encSalt=salt;return JSON.parse(dec.decode(pt))}
    catch(e){throw new Error("Неверный пароль шифрования: облачная копия не открывается этим паролем.")}
  }
  if(o.app!=="kvest-planer")throw new Error("В гисте лежат не данные планера.");
  return o;
}
async function gh(path,opts){
  const r=await fetch("https://api.github.com"+path,{...(opts||{}),cache:"no-store",headers:{"Authorization":"Bearer "+dev.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"}});
  if(r.status===401)throw new Error("GitHub не принял токен. Проверь, что он скопирован целиком и не отозван.");
  if(r.status===404)throw new Error("Гист не найден. Отключи синхронизацию и подключи заново.");
  if(r.status===403)throw new Error("GitHub отказал в доступе (403). Проверь, что у токена стоит галочка gist.");
  if(!r.ok)throw new Error("GitHub ответил ошибкой "+r.status+".");
  return r.json();
}
async function pullRemote(){
  const g=await gh("/gists/"+dev.gistId),f=g.files&&g.files[GIST_FILE];
  if(!f)return null;
  const text=f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content;
  return unpackData(text);
}
async function pushRemote(){
  const content=await packData(D);
  await gh("/gists/"+dev.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content}}})});
}
const Sync={
  state:"",timer:null,busy:false,again:false,
  on(){return !!(dev.token&&dev.gistId)},
  schedule(){if(!this.on())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),2500)},
  set(st){this.state=st;if(U.tab==="settings"){const el=$("syncCard");if(el&&!el.contains(document.activeElement))el.innerHTML=syncInner()}},
  async run(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    if(!navigator.onLine){this.set("offline");return}
    this.busy=true;this.set("sync");
    try{
      const remote=await pullRemote();
      if(remote){
        const merged=merge(D,remote);
        if(canon(merged)!==canon(D)){D=merged;ls.set(KEY,D);if(U.tab!=="settings")render()}
        if(canon(merged)!==canon(normalize(remote)))await pushRemote();
      }else await pushRemote();
      dev.lastSync=Date.now();dev.lastErr="";saveDev();this.busy=false;this.set("ok");
    }catch(e){dev.lastErr=e.message||"Ошибка синхронизации";saveDev();this.busy=false;this.set("err")}
    if(this.again){this.again=false;this.schedule()}
  },
  async connect(token,pass){
    dev.token=token;dev.pass=pass;dev.lastErr="";encSalt=null;
    let id="";
    for(let page=1;page<=5&&!id;page++){
      const list=await gh("/gists?per_page=100&page="+page);
      const hit=list.find(g=>g.files&&g.files[GIST_FILE]);if(hit)id=hit.id;
      if(list.length<100)break;
    }
    if(!id){const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Квест-планер: синхронизация",public:false,files:{[GIST_FILE]:{content:await packData(D)}}})});id=g.id}
    dev.gistId=id;saveDev();
    await this.run();
  },
  off(){dev.token="";dev.gistId="";dev.pass="";dev.lastSync=0;dev.lastErr="";encSalt=null;saveDev();this.state=""}
};

document.addEventListener("submit",e=>{
  const fm=e.target,f=fm.dataset.f;if(!f)return;e.preventDefault();const t=today();
  if(f==="todo"){const name=($("todoIn").value||"").trim();if(!name){$("todoIn").focus();return}const diff=$("todoDiff").value;addTodo(name,diff);$("todoIn").value="";save();render();const ti=$("todoIn");if(ti)ti.focus();return}
  if(f==="newboss"){const name=($("bossIn").value||"").trim();if(!name){$("bossIn").focus();return}$("bossIn").value="";act(()=>{setBoss(addTodo(name,"hard"));return null});toast("Босс дня назначен");return}
  if(f==="tx"){
    const amt=parseAmt($("amt").value);if(!(amt>0)){toast("Введи сумму");$("amt").focus();return}
    const inc=U.kind==="inc",id=uid(),cat=inc?U.icat:U.cat;
    D.fin.tx[id]={id,d:t,ts:Date.now(),amt:Math.round(amt*100)/100,kind:inc?"inc":"exp",cat,note:($("note").value||"").trim(),at:Date.now()};
    $("amt").value="";$("note").value="";if(inc)U.kind="exp";save();render();
    toast(inc?"+"+rub(amt)+" записано":"−"+rub(amt)+" записано");
    if(!inc&&cat==="bet"){const m=model();const lim=m&&Number(m.cfg.betLimit);if(lim&&m.cur.bet.out>lim)toast("Лимит на ставки превышен: "+rub(m.cur.bet.out)+" из "+rub(lim)+". Стоп до выплаты.",true);else if(lim)toast("На ставки осталось "+rub(lim-m.cur.bet.out))}
    return;
  }
  if(f==="payin"){const inp=fm.querySelector("input");const v=parseAmt(inp.value),m=model();if(!(v>=0)){toast("Введи сумму");return}if(!m)return;patchPeriod(m.per.key,{income:v});inp.value="";save();render();toast("Сумма выплаты записана");return}
  if(f==="recalc"){const v=parseAmt($("real").value),m=model();if(!(v>=0)){toast("Введи сумму");return}if(!m)return;patchPeriod(m.per.key,{anchor:{d:t,amount:v,skip:Object.keys(m.pdoc.paid||{})}});$("real").value="";save();toast("Пересчитано");U.mv="today";setTab("money");return}
  if(f==="debtpay"){const id=fm.dataset.id,inp=$("debtAmt"),v=parseAmt(inp.value),d=D.fin.debts[id];if(!(v>0)||!d){toast("Введи сумму");return}
    U.payDebt=null;act(()=>{const tid=uid();D.fin.tx[tid]={id:tid,d:t,ts:Date.now(),amt:Math.round(v*100)/100,kind:"exp",cat:"debt",debtId:id,note:"Досрочно",at:Date.now()};return "Удар по долгу «"+d.name+"»"});
    if(debtLeft(D.fin.debts[id])<=0)toast("Долг «"+esc(d.name)+"» повержен!",true);return}
  if(f==="fin"){
    const {errs,cfg,now}=readFin(),er=$("ferr");
    if(errs.length){er.textContent=errs.join(" ");er.hidden=false;er.scrollIntoView({block:"center"});return}
    const first=!D.fin.cfg;D.fin.cfg=cfg;D.fin.cfgAt=Date.now();U.bd=null;
    if(first&&now!=null){const per=periodAt(cfg,parse(t));if(per)patchPeriod(per.key,{anchor:{d:t,amount:now}})}
    save();toast(first?"Готово, бюджет посчитан":"Бюджет сохранён");if(first){U.mv="today";setTab("money")}else render();return;
  }
});

/* ================= boot ================= */
let lastDay=today();
setInterval(()=>{sprintTick();const t=today();if(t!==lastDay){if(U.view===lastDay)U.view=t;lastDay=t;if(U.tab!=="settings")render()}},1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){sprintTick();Sync.run()}});
window.addEventListener("online",()=>Sync.run());
setInterval(()=>{if(document.visibilityState==="visible")Sync.run()},120000);
if(!["today","money","stats","settings"].includes(U.tab))U.tab="today";
render();sprintTick();Sync.run();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
